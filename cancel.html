
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>Cancel Booking | Adyan Detailing Co.</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: #101010;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 460px;
      padding: 35px 25px;
      background: #191919;
      border: 1px solid #d4af62;
      border-radius: 15px;
      text-align: center;
    }

    h1 {
      color: #d4af62;
      margin-bottom: 8px;
    }

    p {
      color: #ccc;
      line-height: 1.6;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 20px;
      background: #d4af37;
      border: none;
      border-radius: 8px;
      color: #111;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #message {
      margin-top: 20px;
    }

    a {
      color: #d4af37;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Adyan Detailing Co.</h1>
    <h2>Cancel Your Booking</h2>

    <p>
      You can cancel your appointment more than
      12 hours before its scheduled start.
    </p>

    <p>
      Cancelling will release your appointment
      slot for another customer.
    </p>

    <button id="cancelBtn" type="button">
      Confirm Cancellation
    </button>

    <p id="message" role="status"></p>

    <a href="./index.html">Return to Home</a>
  </main>

  <script>
    const FUNCTION_URL =
      "https://qscedtbmoenmepmaxjyc.supabase.co/functions/v1/cancel-booking";

    const button = document.getElementById("cancelBtn");
    const message = document.getElementById("message");

    // Use the fragment so the private token is
    // not sent to GitHub Pages in the page request.
    const fragment = new URLSearchParams(
      window.location.hash.slice(1)
    );

    const token = fragment.get("token");

    // Remove the token from the visible address.
    if (token) {
      history.replaceState(
        null,
        "",
        window.location.pathname
      );
    }

    if (!token || !/^[0-9a-f]{64}$/i.test(token)) {
      button.disabled = true;
      message.textContent =
        "Invalid or missing cancellation link.";
    }

    button.addEventListener("click", async () => {
      if (!token) return;

      if (!confirm(
        "Are you sure you want to cancel your booking?"
      )) {
        return;
      }

      button.disabled = true;
      message.textContent = "Processing cancellation...";

      try {
        const response = await fetch(FUNCTION_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ token })
        });

        const result = await response.json();

        if (response.ok && result.success === true) {
          message.textContent =
            "Your booking has been cancelled successfully.";
          button.textContent = "Booking Cancelled";
        } else {
          message.textContent =
            "Unable to cancel. The link may be invalid, " +
            "already used, or the appointment may be " +
            "less than 12 hours away.";
        }
      } catch (error) {
        message.textContent =
          "Connection error. Please try again.";
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
